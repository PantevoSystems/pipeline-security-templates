name: Checkov IaC Scan
# Reusable workflow — Infrastructure as Code security scanning
# Scans: Terraform, CloudFormation, Kubernetes, Helm, ARM, Dockerfile, GitHub Actions
# See: https://www.checkov.io/

on:
  workflow_call:
    inputs:
      directory:
        description: 'Directory to scan. Default: repo root.'
        required: false
        type: string
        default: '.'
      framework:
        description: 'Frameworks to scan (comma-separated)'
        required: false
        type: string
        default: 'all'
      soft-fail:
        description: 'Report findings without failing the build'
        required: false
        type: boolean
        default: false
      skip-checks:
        description: 'Comma-separated check IDs to skip (e.g. CKV_AWS_18,CKV_K8S_43)'
        required: false
        type: string
        default: ''
      check:
        description: 'Run only specific checks (comma-separated check IDs)'
        required: false
        type: string
        default: ''
    outputs:
      total_count:
        description: 'Total number of failed Checkov checks'
        value: ${{ jobs.checkov.outputs.total_count }}
      critical_count:
        description: 'Number of CRITICAL Checkov failures'
        value: ${{ jobs.checkov.outputs.critical_count }}

jobs:
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    outputs:
      total_count: ${{ steps.parse.outputs.total_count }}
      critical_count: ${{ steps.parse.outputs.critical_count }}
    permissions:
      contents: read
      security-events: write
      actions: read     
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # checkov-action läuft als Docker-Action und kann nur in den Workspace schreiben.
      # Vorhandene Ergebnisdateien (z. B. aus einem PR eingecheckt) vorher löschen.
      - name: Remove pre-existing result files
        shell: bash
        run: rm -rf -- checkov-results.sarif results_sarif.sarif

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: ${{ inputs.directory }}
          framework: ${{ inputs.framework }}
          soft_fail: ${{ inputs.soft-fail }}
          skip_check: ${{ inputs.skip-checks }}
          check: ${{ inputs.check }}
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          download_external_modules: true
          quiet: false

      # Ergebnis prüfen und nach RUNNER_TEMP kopieren — Upload und Parsing nutzen denselben Pfad.
      # Fehlt die Datei, ist der Scan nicht durchgelaufen → Job schlägt fehl (nie still 0 Findings).
      - name: Locate SARIF
        id: locate
        if: always()
        shell: bash
        run: |
          # checkov-action v12 schreibt manchmal in ein Verzeichnis statt direkt zur Datei
          FOUND=""
          for candidate in \
              checkov-results.sarif \
              checkov-results.sarif/results_sarif.sarif \
              results_sarif.sarif; do
            if [ -f "$candidate" ] && [ ! -L "$candidate" ]; then
              FOUND="$candidate"
              break
            fi
          done
          if [ -z "$FOUND" ] || ! jq -e '.runs | type == "array"' "$FOUND" >/dev/null 2>&1; then
            echo "::error title=Checkov::No valid SARIF result - the scan did not complete. Refusing to report 0 findings."
            exit 1
          fi
          SARIF="${RUNNER_TEMP:?RUNNER_TEMP not set}/checkov-results.sarif"
          rm -rf -- "$SARIF"
          cp -- "$FOUND" "$SARIF"
          echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"
          echo "Checkov SARIF: $FOUND"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        if: always() && steps.locate.outputs.sarif != ''
        continue-on-error: true 
        with:
          sarif_file: ${{ steps.locate.outputs.sarif }}
          category: checkov

      - name: Parse SARIF for Deployment Guard
        id: parse
        if: always()
        shell: bash
        env:
          SARIF: ${{ steps.locate.outputs.sarif }}
        run: |
          if [ -z "$SARIF" ] || [ ! -s "$SARIF" ]; then
            echo "::error title=Checkov::No SARIF result - refusing to report 0 findings."
            exit 1
          fi
          # Checkov: alle level=error sind failed checks. CRITICAL via properties.severity.
          TOTAL=$(jq '[.runs[]?.results[]? | select(.level == "error")] | length' "$SARIF") || exit 1
          CRIT=$(jq  '[.runs[]?.results[]?
                       | select(.level == "error")
                       | select((.properties.severity? // "" | ascii_upcase) == "CRITICAL")
                      ] | length' "$SARIF") || exit 1
          echo "total_count=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "critical_count=${CRIT}" >> "$GITHUB_OUTPUT"
          echo "Checkov: $TOTAL failed, $CRIT CRITICAL"
