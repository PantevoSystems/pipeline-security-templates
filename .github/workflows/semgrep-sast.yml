name: Semgrep SAST Scan

on:
  workflow_call:
    inputs:
      config:
        description: 'Semgrep ruleset. Common: p/default, p/security-audit, p/ci, p/owasp-top-ten, or auto'
        required: false
        type: string
        default: 'p/default'
      severity:
        description: 'Minimum severity to report: ERROR, WARNING, INFO'
        required: false
        type: string
        default: 'WARNING'
      fail-on-issues:
        description: 'Fail the build when findings match severity threshold'
        required: false
        type: boolean
        default: true
      paths-include:
        description: 'Paths to include (newline-separated). Default: scan everything.'
        required: false
        type: string
        default: ''
      paths-exclude:
        description: 'Paths to exclude (newline-separated). E.g. test/ or vendor/'
        required: false
        type: string
        default: ''
    outputs:
      total_count:
        description: 'Total number of Semgrep findings'
        value: ${{ jobs.semgrep.outputs.total_count }}
      high_count:
        description: 'Number of HIGH-severity Semgrep findings (level=error)'
        value: ${{ jobs.semgrep.outputs.high_count }}

jobs:
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    outputs:
      total_count: ${{ steps.parse.outputs.total_count }}
      high_count: ${{ steps.parse.outputs.high_count }}
    container:
      image: semgrep/semgrep:1.92.0
    permissions:
      contents: read
      security-events: write
      actions: read     
    steps:
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep scan
        id: scan
        env:
          SEMGREP_RULES: ${{ inputs.config }}
          PATHS_INCLUDE: ${{ inputs.paths-include }}
          PATHS_EXCLUDE: ${{ inputs.paths-exclude }}
          SEVERITY: ${{ inputs.severity }}
        shell: sh
        run: |
          set +e

          # Extra-Argumente als Positionsparameter sammeln: Here-Doc statt Pipe,
          # damit die Schleife in der aktuellen Shell läuft (kein Subshell-Verlust)
          # und Pfade mit Leerzeichen ein Argument bleiben.
          set --

          if [ -n "$PATHS_INCLUDE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              set -- "$@" "--include=$line"
            done <<EOF_INCLUDE
          $PATHS_INCLUDE
          EOF_INCLUDE
          fi

          if [ -n "$PATHS_EXCLUDE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              set -- "$@" "--exclude=$line"
            done <<EOF_EXCLUDE
          $PATHS_EXCLUDE
          EOF_EXCLUDE
          fi

          echo "Semgrep extra args: $*"

          semgrep scan \
            --sarif \
            --output=semgrep-results.sarif \
            --severity="$SEVERITY" \
            "$@"
          SCAN_EXIT=$?

          if [ ! -f semgrep-results.sarif ]; then
            echo "Warning: SARIF file not generated, creating empty placeholder"
            echo '{"version":"2.1.0","runs":[]}' > semgrep-results.sarif
          fi

          echo "scan_exit=$SCAN_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        if: always()
        continue-on-error: true 
        with:
          sarif_file: 'semgrep-results.sarif'
          category: semgrep

      - name: Parse SARIF for Deployment Guard
        id: parse
        if: always()
        shell: sh
        run: |
          # jq nachinstallieren (Alpine-Container)
          apk add --no-cache jq >/dev/null 2>&1 || true
          if [ ! -f semgrep-results.sarif ]; then
            echo "total_count=0" >> "$GITHUB_OUTPUT"
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Semgrep SARIF: level "error" = HIGH, sonst niedriger
          TOTAL=$(jq '[.runs[0].results[]?] | length' semgrep-results.sarif)
          HIGH=$(jq  '[.runs[0].results[]? | select(.level == "error")] | length' semgrep-results.sarif)
          echo "total_count=${TOTAL:-0}" >> "$GITHUB_OUTPUT"
          echo "high_count=${HIGH:-0}" >> "$GITHUB_OUTPUT"
          echo "Semgrep: $TOTAL total, $HIGH HIGH"

      - name: Run Semgrep again (table output for logs)
        if: always()
        env:
          SEMGREP_RULES: ${{ inputs.config }}
          SEVERITY: ${{ inputs.severity }}
        shell: sh
        run: |
          semgrep scan --severity="$SEVERITY" || true

      - name: Fail build if requested
        if: inputs.fail-on-issues && steps.scan.outputs.scan_exit != '0'
        env:
          SEVERITY: ${{ inputs.severity }}
        run: |
          echo "Semgrep found issues at severity $SEVERITY or higher."
          exit 1