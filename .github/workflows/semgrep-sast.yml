name: Semgrep SAST Scan

on:
  workflow_call:
    inputs:
      config:
        description: 'Semgrep ruleset. Common: p/default, p/security-audit, p/ci, p/owasp-top-ten, or auto'
        required: false
        type: string
        default: 'p/default'
      severity:
        description: 'Minimum severity to report: ERROR, WARNING, INFO (higher levels are always included, e.g. WARNING = WARNING + ERROR)'
        required: false
        type: string
        default: 'WARNING'
      fail-on-issues:
        description: 'Fail the build when findings match severity threshold'
        required: false
        type: boolean
        default: true
      paths-include:
        description: 'Paths to include (newline-separated). Default: scan everything.'
        required: false
        type: string
        default: ''
      paths-exclude:
        description: 'Paths to exclude (newline-separated). E.g. test/ or vendor/'
        required: false
        type: string
        default: ''
    outputs:
      total_count:
        description: 'Total number of Semgrep findings'
        value: ${{ jobs.semgrep.outputs.total_count }}
      high_count:
        description: 'Number of HIGH-severity Semgrep findings (level=error)'
        value: ${{ jobs.semgrep.outputs.high_count }}

jobs:
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    outputs:
      total_count: ${{ steps.parse.outputs.total_count }}
      high_count: ${{ steps.parse.outputs.high_count }}
    container:
      image: semgrep/semgrep:1.92.0
    permissions:
      contents: read
      security-events: write
      actions: read     
    steps:
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep scan
        id: scan
        env:
          SEMGREP_CONFIG: ${{ inputs.config }}
          PATHS_INCLUDE: ${{ inputs.paths-include }}
          PATHS_EXCLUDE: ${{ inputs.paths-exclude }}
          SEVERITY: ${{ inputs.severity }}
        shell: sh
        run: |
          set +e
          # jq für die SARIF-Prüfung nachinstallieren (Alpine-Container); fehlt jq, schlägt die Prüfung fehl
          command -v jq >/dev/null 2>&1 || apk add --no-cache jq >/dev/null 2>&1 || true

          # Semgrep: --severity ist ein exakter Filter (wiederholbar). Der Input ist eine
          # Mindest-Severity → höhere Stufen explizit mitgeben.
          case "$SEVERITY" in
            ERROR)   set -- --severity=ERROR ;;
            WARNING) set -- --severity=WARNING --severity=ERROR ;;
            INFO)    set -- --severity=INFO --severity=WARNING --severity=ERROR ;;
            *) echo "::error title=Semgrep::Input severity must be ERROR, WARNING or INFO."; exit 1 ;;
          esac

          # Regelpakete als --config-Argumente (Komma oder Leerzeichen getrennt).
          # SEMGREP_RULES erwartet Leerzeichen; eine Komma-Liste fuehrte zu Exit 7.
          set -f  # keine Glob-Expansion der Config-Eintraege
          for c in $(printf '%s' "${SEMGREP_CONFIG:-p/default}" | tr ',' ' '); do
            case "$c" in
              *[!A-Za-z0-9_./:@-]*|"") echo "::error title=Semgrep::Invalid config entry: $c"; exit 1 ;;
            esac
            set -- "$@" "--config=$c"
          done

          # Extra-Argumente als Positionsparameter sammeln: Here-Doc statt Pipe,
          # damit die Schleife in der aktuellen Shell läuft (kein Subshell-Verlust)
          # und Pfade mit Leerzeichen ein Argument bleiben.
          if [ -n "$PATHS_INCLUDE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              set -- "$@" "--include=$line"
            done <<EOF_INCLUDE
          $PATHS_INCLUDE
          EOF_INCLUDE
          fi

          if [ -n "$PATHS_EXCLUDE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              set -- "$@" "--exclude=$line"
            done <<EOF_EXCLUDE
          $PATHS_EXCLUDE
          EOF_EXCLUDE
          fi

          echo "Semgrep extra args: $*"

          # Ergebnis nach RUNNER_TEMP (nicht in den Workspace) und vorher löschen —
          # ein PR kann so keine eigene SARIF-Datei unterschieben.
          SARIF="${RUNNER_TEMP:?RUNNER_TEMP not set}/semgrep-results.sarif"
          rm -rf -- "$SARIF"
          echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"

          # --error: Exit 1 = Findings, Exit >= 2 = Scanner-Fehler
          semgrep scan \
            --sarif \
            --output="$SARIF" \
            --error \
            "$@"
          SCAN_EXIT=$?

          if [ "$SCAN_EXIT" -ge 2 ]; then
            echo "::error title=Semgrep::Scanner error (exit $SCAN_EXIT) - failing regardless of fail-on-issues. Refusing to report 0 findings."
            exit 1
          fi
          if [ ! -s "$SARIF" ] || ! jq -e '.runs | type == "array"' "$SARIF" >/dev/null 2>&1; then
            echo "::error title=Semgrep::No valid SARIF result - failing regardless of fail-on-issues."
            exit 1
          fi

          echo "scan_exit=$SCAN_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        if: always()
        continue-on-error: true 
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: semgrep

      - name: Parse SARIF for Deployment Guard
        id: parse
        if: always()
        shell: sh
        env:
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          command -v jq >/dev/null 2>&1 || apk add --no-cache jq >/dev/null 2>&1 || true
          # Fehlende/ungültige SARIF = Scanner-Fehler → Job schlägt fehl (nie still 0 Findings)
          if [ -z "$SARIF" ] || [ ! -s "$SARIF" ] || ! jq -e '.runs | type == "array"' "$SARIF" >/dev/null 2>&1; then
            echo "::error title=Semgrep::No valid SARIF result - refusing to report 0 findings."
            exit 1
          fi
          # Semgrep SARIF: level "error" = HIGH, sonst niedriger
          TOTAL=$(jq '[.runs[]?.results[]?] | length' "$SARIF") || exit 1
          HIGH=$(jq  '[.runs[]?.results[]? | select(.level == "error")] | length' "$SARIF") || exit 1
          echo "total_count=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "high_count=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "Semgrep: $TOTAL total, $HIGH HIGH"

      - name: Run Semgrep again (table output for logs)
        if: always()
        env:
          SEMGREP_CONFIG: ${{ inputs.config }}
          SEVERITY: ${{ inputs.severity }}
        shell: sh
        run: |
          case "$SEVERITY" in
            ERROR)   set -- --severity=ERROR ;;
            WARNING) set -- --severity=WARNING --severity=ERROR ;;
            INFO)    set -- --severity=INFO --severity=WARNING --severity=ERROR ;;
            *) exit 0 ;;
          esac
          # Regelpakete als --config-Argumente (Komma oder Leerzeichen getrennt).
          # SEMGREP_RULES erwartet Leerzeichen; eine Komma-Liste fuehrte zu Exit 7.
          set -f  # keine Glob-Expansion der Config-Eintraege
          for c in $(printf '%s' "${SEMGREP_CONFIG:-p/default}" | tr ',' ' '); do
            case "$c" in
              *[!A-Za-z0-9_./:@-]*|"") echo "::error title=Semgrep::Invalid config entry: $c"; exit 0 ;;
            esac
            set -- "$@" "--config=$c"
          done
          semgrep scan "$@" || true

      - name: Fail build if requested
        if: inputs.fail-on-issues && steps.scan.outputs.scan_exit == '1'
        env:
          SEVERITY: ${{ inputs.severity }}
        run: |
          echo "Semgrep found issues at severity $SEVERITY or higher."
          exit 1