name: Trivy Container Scan
# Reusable workflow — call from your repo with `uses:`
# See: https://docs.github.com/en/actions/using-workflows/reusing-workflows

on:
  workflow_call:
    inputs:
      image:
        description: 'Container image to scan. Leave empty to build from Dockerfile in repo root.'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile (only used if image is empty)'
        required: false
        type: string
        default: 'Dockerfile'
      severity:
        description: 'Comma-separated severity levels: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      fail-on-issues:
        description: 'Fail the build when vulnerabilities are found'
        required: false
        type: boolean
        default: true
      ignore-unfixed:
        description: 'Ignore vulnerabilities without an available fix'
        required: false
        type: boolean
        default: true
    outputs:
      critical_count:
        description: 'Number of CRITICAL CVEs (CVSS >= 9.0)'
        value: ${{ jobs.trivy.outputs.critical_count }}
      high_count:
        description: 'Number of HIGH CVEs (CVSS 7.0-8.9)'
        value: ${{ jobs.trivy.outputs.high_count }}

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    outputs:
      critical_count: ${{ steps.parse.outputs.critical_count }}
      high_count: ${{ steps.parse.outputs.high_count }}
    permissions:
      contents: read
      security-events: write
      actions: read     
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (if no image provided)
        if: inputs.image == ''
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build -t scan-target:latest -f "$DOCKERFILE" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image == '' && 'scan-target:latest' || inputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          exit-code: ${{ inputs.fail-on-issues && '1' || '0' }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        continue-on-error: true 
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container

      - name: Parse SARIF for Deployment Guard
        id: parse
        if: always()
        shell: bash
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "critical_count=0" >> $GITHUB_OUTPUT
            echo "high_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Trivy SARIF: properties.security-severity = CVSS-Score (string)
          # CRITICAL: >= 9.0, HIGH: 7.0-8.9
          CRIT=$(jq '[.runs[0].results[]?
                      | (.properties."security-severity" // "0" | tonumber)
                      | select(. >= 9.0)] | length' trivy-results.sarif)
          HIGH=$(jq '[.runs[0].results[]?
                      | (.properties."security-severity" // "0" | tonumber)
                      | select(. >= 7.0 and . < 9.0)] | length' trivy-results.sarif)
          echo "critical_count=${CRIT:-0}" >> $GITHUB_OUTPUT
          echo "high_count=${HIGH:-0}" >> $GITHUB_OUTPUT
          echo "Trivy: $CRIT CRITICAL, $HIGH HIGH"

      - name: Run Trivy (table output for logs)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image == '' && 'scan-target:latest' || inputs.image }}
          format: 'table'
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          exit-code: '0'