# Semgrep SAST Scan — GitLab CI Template
#
# Usage in your .gitlab-ci.yml:
#
#   include:   # pinned to release tag v1.2.4 (next release) — never main
#     - remote: 'https://raw.githubusercontent.com/PantevoSystems/pipeline-security-templates/v1.2.4/gitlab-ci/semgrep.yml'
#
#   semgrep_scan:
#     extends: .semgrep_template

.semgrep_template:
  stage: test
  image: semgrep/semgrep:1.92.0
  variables:
    SEMGREP_RULES: "p/default"
    SEMGREP_SEVERITY: "WARNING"
    SEMGREP_FAIL_ON_ISSUES: "true"
    SEMGREP_PATHS_EXCLUDE: ""    # Newline-separated, e.g. "tests/\nvendor/"
  script:
    - |
      # Path excludes als Positionsparameter sammeln — Here-Doc statt Pipe,
      # damit die Schleife nicht in einer Subshell läuft (sonst bleibt die Liste leer)
      set --
      if [ -n "$SEMGREP_PATHS_EXCLUDE" ]; then
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          set -- "$@" "--exclude=$line"
        done <<EOF_EXCLUDE
      $SEMGREP_PATHS_EXCLUDE
      EOF_EXCLUDE
      fi

      # Run scan with table output for logs
      semgrep scan --severity="$SEMGREP_SEVERITY" "$@" || true

      # Run again with GitLab SAST format
      if [ "$SEMGREP_FAIL_ON_ISSUES" = "true" ]; then
        semgrep scan --severity="$SEMGREP_SEVERITY" --gitlab-sast --output gl-sast-report.json "$@" --error
      else
        semgrep scan --severity="$SEMGREP_SEVERITY" --gitlab-sast --output gl-sast-report.json "$@"
      fi
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    expire_in: 1 week
  allow_failure: false