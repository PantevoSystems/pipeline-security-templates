# Full Security Stack — GitLab CI Template
# Trivy + Semgrep + Checkov in parallel
#
# Usage in your .gitlab-ci.yml:
#
#   include:   # pinned to release tag v1.2.6 (next release) — never main
#     - remote: 'https://raw.githubusercontent.com/PantevoSystems/pipeline-security-templates/v1.2.6/gitlab-ci/full-stack.yml'
#
#   stages:
#     - security
#
#   trivy_scan:
#     extends: .trivy_template
#     stage: security
#
#   semgrep_scan:
#     extends: .semgrep_template
#     stage: security
#
#   checkov_scan:
#     extends: .checkov_template
#     stage: security

# Pinned to release tag v1.2.6 (next release) instead of main — the tag must exist before use.
include:
  - remote: 'https://raw.githubusercontent.com/PantevoSystems/pipeline-security-templates/v1.2.6/gitlab-ci/trivy.yml'
