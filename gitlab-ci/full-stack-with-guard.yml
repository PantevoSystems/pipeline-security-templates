# Full Security Stack + Deployment Guard — GitLab CI Template
#
# Get an API key: https://www.pantevosystems.com/signup
#
# Usage in your .gitlab-ci.yml:
#
#   include:   # pinned to release tag v1.2.6 (next release) — never main
#     - remote: 'https://raw.githubusercontent.com/PantevoSystems/pipeline-security-templates/v1.2.6/gitlab-ci/full-stack-with-guard.yml'
#
#   stages:
#     - security
#     - risk
#
#   trivy_scan:
#     extends: .trivy_template
#     stage: security
#
#   semgrep_scan:
#     extends: .semgrep_template
#     stage: security
#
#   checkov_scan:
#     extends: .checkov_template
#     stage: security
#
#   deployment_guard:
#     extends: .deployment_guard_template
#     stage: risk
#
# Required secret variable in GitLab:
#   GUARD_API_KEY (Settings → CI/CD → Variables, masked)
#
# Optional variables:
#   GUARD_FAIL_ON_WARN=true       — also fail on WARN
#   GUARD_FAIL_OPEN=false         — fail when the API is unreachable / times out / returns 429 / 5xx /
#                                   an invalid body on HTTP 200 (default: true, warning only).
#                                   Every other HTTP status (redirects, 401/402/403/404/413/422, …)
#                                   always fails. Redirects are never followed.
#   All boolean variables accept exactly true or false — anything else fails the job.
#   GUARD_ALLOW_MISSING_KEY=true  — skip (instead of fail) when GUARD_API_KEY is not set
#   GUARD_DIFF_BASE=<sha>         — override the diff base
#
# Diff base: CI_MERGE_REQUEST_DIFF_BASE_SHA (MR) → CI_COMMIT_BEFORE_SHA (push) → HEAD~1.
# Tag pipelines, new branches and manual runs fall back to HEAD~1 (only the last commit is
# scored, the job prints a WARNING) — set GUARD_DIFF_BASE for tag/release deploys.
# Repo .gitattributes are ignored for the diff (needs git >= 2.40), so "* -diff" cannot hide lines.
# The guard job sets GIT_DEPTH: 0 (full clone) so the base commit is available.
#
# Sent to the API: repo path, branch, commit SHA, lines added/removed, files changed.
# No source code, no file contents.
#
# The includes are pinned to the release tag v1.2.6 (not main). Pin to a tag you have reviewed.

# Pinned to release tag v1.2.6 (next release) instead of main — the tag must exist before use.
include:
  - remote: 'https://raw.githubusercontent.com/PantevoSystems/pipeline-security-templates/v1.2.6/gitlab-ci/trivy.yml'
  - remote: 'https://raw.githubusercontent.com/PantevoSystems/pipeline-security-templates/v1.2.6/gitlab-ci/semgrep.yml'
  - remote: 'https://raw.githubusercontent.com/PantevoSystems/pipeline-security-templates/v1.2.6/gitlab-ci/checkov.yml'

.deployment_guard_template:
  stage: risk
  image: python:3.12.13-slim   # feste Version; Digest konnte nicht aufgelöst werden — bei Bedarf @sha256:… ergänzen
  variables:
    GIT_DEPTH: "0"
    GUARD_API_URL: "https://api.pantevosystems.com"
    GUARD_FAIL_ON_WARN: "false"
    GUARD_FAIL_OPEN: "true"
    GUARD_ALLOW_MISSING_KEY: "false"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
  script:
    - |
      GUARD_FAIL_ON_WARN="${GUARD_FAIL_ON_WARN:-false}"
      # Boolean variables: only exactly true/false (typos like "True" or "yes" must not change the gate)
      for pair in "GUARD_FAIL_ON_WARN=${GUARD_FAIL_ON_WARN}" "GUARD_ALLOW_MISSING_KEY=${GUARD_ALLOW_MISSING_KEY:-false}" "GUARD_FAIL_OPEN=${GUARD_FAIL_OPEN:-true}"; do
        case "${pair#*=}" in
          true|false) ;;
          *) echo "❌ ${pair%%=*} must be 'true' or 'false'."; exit 1 ;;
        esac
      done

      if [ -z "${GUARD_API_KEY:-}" ]; then
        if [ "${GUARD_ALLOW_MISSING_KEY:-false}" = "true" ]; then
          echo "⚠️  GUARD_API_KEY not set — skipping Deployment Guard (GUARD_ALLOW_MISSING_KEY=true)."
          echo "Get a free API key: https://www.pantevosystems.com/signup"
          exit 0
        fi
        echo "❌ GUARD_API_KEY not set — failing. Set GUARD_ALLOW_MISSING_KEY=true to skip instead."
        echo "Get a free API key: https://www.pantevosystems.com/signup"
        exit 1
      fi

      git config --global --add safe.directory "$(pwd)" 2>/dev/null || true
      DG_RESULT=$(mktemp)
      export DG_RESULT

      # Diff, Payload (json.dumps), API Call und Parsing (json) in Python
      RC=0
      python3 - <<'PY' || RC=$?
      import json, os, re, subprocess, sys, urllib.error, urllib.request

      EXTENDED = False   # True: zusätzlich K8s-/Helm-Zähler senden
      EMPTY_TREE = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
      E = os.environ.get
      FALLBACK_WARNING = ("[guard] WARNING: diff base fell back to HEAD~1 – only the last commit is scored. "
                          "Set GUARD_DIFF_BASE for tag/release/dispatch deploys.")


      def out(msg):
          print(msg, flush=True)


      def clean(s, limit=4000):
          # Steuerzeichen (ANSI, CR, C1, ...) aus fremdem Text entfernen — nur \n und \t bleiben
          s = "" if s is None else str(s)
          return re.sub(r"[\x00-\x08\x0b-\x1f\x7f-\x9f]", "", s)[:limit]


      def fatal(msg):
          out("❌ Deployment Guard: " + clean(msg))
          sys.exit(1)


      if E("GUARD_FAIL_OPEN", "true") not in ("true", "false"):
          fatal("GUARD_FAIL_OPEN must be 'true' or 'false' (got %r)" % clean(E("GUARD_FAIL_OPEN"), 40))
      FAIL_OPEN = E("GUARD_FAIL_OPEN", "true") == "true"


      def soft(msg):
          # Nur echte Ausfälle (Netzwerk, Timeout, 429, 5xx, ungültiger 200-Body):
          # Warnung (GUARD_FAIL_OPEN=true, Standard) oder Abbruch (false)
          if FAIL_OPEN:
              out("⚠️  Deployment Guard: " + clean(msg) + " — GUARD_FAIL_OPEN=true, deployment continues.")
              sys.exit(3)
          out("❌ Deployment Guard: " + clean(msg) + " — failing (fail-closed). Set GUARD_FAIL_OPEN=true to tolerate API outages.")
          sys.exit(1)


      def git(*args):
          # Repo-.gitattributes ignorieren (leerer Attribut-Baum): attr.tree (git >= 2.42),
          # GIT_ATTR_SOURCE (git >= 2.40) — sonst macht "* -diff" alle Zeilenzahlen zu 0
          env = dict(os.environ, GIT_ATTR_SOURCE=EMPTY_TREE)
          return subprocess.run(["git", "-c", "core.quotePath=false", "-c", "attr.tree=" + EMPTY_TREE, *args],
                                capture_output=True, env=env)


      def commit_exists(ref):
          return git("rev-parse", "--verify", "--quiet", ref + "^{commit}").returncode == 0


      def is_sha(v):
          return bool(re.fullmatch(r"[0-9a-f]{40}([0-9a-f]{24})?", v or "")) and not re.fullmatch(r"0+", v)


      api_url = E("GUARD_API_URL", "https://api.pantevosystems.com").rstrip("/")
      if api_url.endswith("/analyze"):
          api_url = api_url[: -len("/analyze")]
      if not re.fullmatch(r"https://\S+|http://(localhost|127\.0\.0\.1)(:\d+)?", api_url):
          fatal("GUARD_API_URL must start with https:// (%s)" % api_url)
      try:
          timeout = int(E("GUARD_HTTP_TIMEOUT", "120"))
      except ValueError:
          fatal("GUARD_HTTP_TIMEOUT must be a number (seconds)")

      m = re.search(r"(\d+)\.(\d+)", git("version").stdout.decode(errors="replace"))
      if not m or (int(m.group(1)), int(m.group(2))) < (2, 40):
          out("[guard] WARNING: git < 2.40 — .gitattributes in the repo can hide diff lines. Use a newer git.")

      shallow = git("rev-parse", "--is-shallow-repository").stdout.decode().strip() == "true"
      HINT = "Set GIT_DEPTH: 0 for the job (full clone)."

      # ── Diff-Basis ──
      # GUARD_DIFF_BASE → CI_MERGE_REQUEST_DIFF_BASE_SHA (GitLab MR)
      # → merge-base mit BITBUCKET_PR_DESTINATION_COMMIT (Bitbucket PR) → CI_COMMIT_BEFORE_SHA (GitLab Push) → HEAD~1
      base, source = "", ""
      if E("GUARD_DIFF_BASE"):
          base, source = E("GUARD_DIFF_BASE"), "GUARD_DIFF_BASE"
          if not commit_exists(base):
              fatal("diff base not available in the clone: '%s' (%s). %s" % (base, source, HINT))
      else:
          for name in ("CI_MERGE_REQUEST_DIFF_BASE_SHA", "BITBUCKET_PR_DESTINATION_COMMIT", "CI_COMMIT_BEFORE_SHA"):
              v = E(name, "")
              if name == "BITBUCKET_PR_DESTINATION_COMMIT":
                  # Bitbucket liefert oft einen kurzen SHA (12 Zeichen)
                  if not re.fullmatch(r"[0-9a-f]{7,40}", v) or re.fullmatch(r"0+", v):
                      continue
                  if commit_exists(v):
                      r = git("merge-base", "HEAD", v)
                      mb = r.stdout.decode(errors="replace").strip()
                      if r.returncode == 0 and re.fullmatch(r"[0-9a-f]{40}([0-9a-f]{24})?", mb):
                          base, source = mb, "merge-base(HEAD, %s)" % name
                          break
              elif not is_sha(v):
                  continue
              elif commit_exists(v):
                  base, source = v, name
                  break
              if shallow:
                  fatal("diff base not available in the clone: '%s' (%s). %s" % (v, name, HINT))
              out("⚠️  %s (%s) not in history (force push?) — trying next candidate" % (name, v[:8]))
      if not base:
          if commit_exists("HEAD~1"):
              base, source = "HEAD~1", "HEAD~1"
              # Tag-Pipeline, neuer Branch, manueller Lauf: nur der letzte Commit wird bewertet
              out(FALLBACK_WARNING)
          elif not shallow and commit_exists("HEAD"):
              base, source = EMPTY_TREE, "initial commit (empty tree)"
          else:
              fatal("diff base not available in the clone: 'HEAD~1'. %s" % HINT)

      # ── Diff-Statistik ──
      DIFF = ("diff", "--no-ext-diff", "--no-textconv")
      r = git(*DIFF, "--numstat", base, "HEAD")
      if r.returncode != 0:
          fatal("git diff --numstat %s..HEAD: %s" % (base, clean(r.stderr.decode(errors="replace"), 300)))
      added = removed = binary = 0
      for line in r.stdout.decode(errors="replace").splitlines():
          parts = line.split("\t")
          if len(parts) >= 3:
              if parts[0] == "-" and parts[1] == "-":
                  binary += 1   # echte Binärdatei: zählt als geänderte Datei, ohne Zeilen
                  continue
              added += int(parts[0]) if parts[0].isdigit() else 0
              removed += int(parts[1]) if parts[1].isdigit() else 0
      r = git(*DIFF, "--name-only", "-z", base, "HEAD")
      if r.returncode != 0:
          fatal("git diff --name-only %s..HEAD failed" % base)
      names = [n.decode(errors="replace") for n in r.stdout.split(b"\0") if n]

      payload = {
          "repo": E("CI_PROJECT_PATH") or E("BITBUCKET_REPO_FULL_NAME", ""),
          "branch": E("CI_COMMIT_REF_NAME") or E("BITBUCKET_BRANCH", ""),
          "commit_sha": E("CI_COMMIT_SHA") or E("BITBUCKET_COMMIT", ""),
          "diff_lines_added": added,
          "diff_lines_removed": removed,
          "diff_files_changed": len(names),
      }
      if EXTENDED:
          k8s_re = re.compile(r"^(k8s|manifests|helm|deploy|kubernetes).*\.(yaml|yml)$")
          values_re = re.compile(r"values.*\.yaml$|values\.yml$")
          payload["k8s_manifests_changed"] = sum(1 for n in names if k8s_re.search(n))
          payload["helm_values_changed"] = sum(1 for n in names if values_re.search(n))
          payload["helm_chart_bumped"] = any(re.search(r"Chart\.yaml$", n) for n in names)

      summary = "Diff: +%d -%d (%d files), base: %s (%s)" % (added, removed, len(names), base[:12], source)
      if EXTENDED:
          summary += ", K8s: %d, Helm values: %d, Chart bump: %s" % (
              payload["k8s_manifests_changed"], payload["helm_values_changed"], str(payload["helm_chart_bumped"]).lower())
      out(clean(summary))
      out("[guard] binary files changed: %d (no line counts, counted as changed files)" % binary)
      gitattr = sum(1 for n in names if n.rsplit("/", 1)[-1] == ".gitattributes")
      if gitattr:
          out("[guard] WARNING: .gitattributes changed (%d) — repo attributes are ignored for the diff, please review this change." % gitattr)


      # ── API Call (Key nur im Header, nie auf der Kommandozeile) ──
      class NoRedirect(urllib.request.HTTPRedirectHandler):
          # Redirects nie verfolgen — der API Key darf nicht an ein Redirect-Ziel gehen
          def redirect_request(self, req, fp, code, msg, headers, newurl):
              raise urllib.error.HTTPError(req.full_url, code, "redirect not followed", headers, fp)


      opener = urllib.request.build_opener(NoRedirect)
      req = urllib.request.Request(
          api_url + "/analyze",
          data=json.dumps(payload).encode("utf-8"),
          method="POST",
          headers={"Content-Type": "application/json", "X-API-Key": E("GUARD_API_KEY", "")},
      )
      try:
          with opener.open(req, timeout=timeout) as resp:
              code, body = resp.status, resp.read()
      except urllib.error.HTTPError as e:
          code = e.code
          try:
              body = e.read() or b""
          except Exception:
              body = b""
      except Exception as e:  # Netzwerkfehler, Timeout, TLS
          soft("API unreachable (%s)" % type(e).__name__)

      # fail-open greift NUR bei 429 und 5xx — alle anderen Codes (3xx, 4xx) brechen immer ab
      if code in (401, 403):
          out(clean(body.decode(errors="replace"), 500))
          fatal("API key invalid or not authorized (HTTP %d)" % code)
      if code in (400, 422):
          out(clean(body.decode(errors="replace"), 500))
          fatal("request rejected — check the inputs (HTTP %d)" % code)
      if code == 429 or 500 <= code <= 599:
          soft("API error (HTTP %d)" % code)
      if 300 <= code <= 399:
          fatal("API answered with a redirect (HTTP %d) — not followed, the key is never sent on. Check GUARD_API_URL. Fails regardless of GUARD_FAIL_OPEN." % code)
      if code != 200:
          out(clean(body.decode(errors="replace"), 500))
          fatal("unexpected HTTP status %d — check GUARD_API_URL, proxy and plan. Fails regardless of GUARD_FAIL_OPEN." % code)

      try:
          data = json.loads(body)
      except ValueError:
          soft("invalid API response (%s)" % "no JSON")
      if not isinstance(data, dict):
          soft("invalid API response (%s)" % "no object")
      status = data.get("status")
      score = data.get("score")
      if status not in ("PASS", "WARN", "BLOCKED"):
          soft("invalid API response (%s)" % ("status=%r" % clean(status, 40)))
      if isinstance(score, bool) or not isinstance(score, (int, float)) or not 0 <= score <= 100:
          soft("invalid API response (%s)" % ("score=%r" % clean(score, 40)))
      score = int(round(score))
      verdict = clean(data.get("verdict"), 60).replace("\n", " ").replace("\t", " ")

      out("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
      out("🛡️  Deployment Guard")
      out("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
      out("Score:   %d / 100" % score)
      out("Verdict: " + verdict)
      out("Status:  " + status)
      explanation = clean(data.get("explanation"))
      if explanation:
          out("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          out("Explanation: " + explanation)
      out("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
      out("Dashboard: https://www.pantevosystems.com/dashboard")

      with open(os.environ["DG_RESULT"], "w") as f:
          f.write("%s\n%d\n%s\n" % (status, score, verdict))
      PY
      if [ "$RC" = "3" ]; then
        exit 0   # GUARD_FAIL_OPEN=true: API-Fehler toleriert
      fi
      if [ "$RC" != "0" ]; then
        exit "$RC"
      fi

      STATUS=$(sed -n 1p "$DG_RESULT")
      SCORE=$(sed -n 2p "$DG_RESULT")
      VERDICT=$(sed -n 3p "$DG_RESULT")
      rm -f "$DG_RESULT"

      # Exit logic (decision of the API, thresholds from the dashboard)
      if [ "$STATUS" = "BLOCKED" ]; then
        echo "❌ Deployment BLOCKED by risk score."
        exit 1
      fi

      if [ "$STATUS" = "WARN" ] && [ "$GUARD_FAIL_ON_WARN" = "true" ]; then
        echo "⚠️  Deployment WARNED and fail-on-warn is enabled."
        exit 1
      fi

      echo "✅ Deployment risk acceptable."
  allow_failure: false
