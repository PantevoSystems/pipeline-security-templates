# Reference YAML for copy-paste:
definitions:
  steps:
    - step: &semgrep-scan
        name: Semgrep SAST
        image: semgrep/semgrep:1.92.0
        script:
          - |
            # --severity is an exact filter: include higher levels (WARNING = WARNING + ERROR)
            case "${SEMGREP_SEVERITY:-WARNING}" in
              ERROR)   set -- --severity=ERROR ;;
              WARNING) set -- --severity=WARNING --severity=ERROR ;;
              INFO)    set -- --severity=INFO --severity=WARNING --severity=ERROR ;;
              *) echo "SEMGREP_SEVERITY must be ERROR, WARNING or INFO"; exit 1 ;;
            esac
            semgrep scan \
              --config="${SEMGREP_RULES:-p/default}" \
              "$@" \
              --json --output=semgrep-results.json \
              --error
        artifacts:
          - semgrep-results.json